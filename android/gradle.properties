# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# This build environment has 4.7GB total RAM — Gradle's own default heap
# was insufficient for compiling sdk_rasp + android_core + this app
# together ("ran out of Java heap space" on the first real build attempt).
# Sized to leave headroom for the OS/other processes on this box, not
# maximized — raise further only if a build still OOMs with this set.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.parallel=false

