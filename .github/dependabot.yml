# Dependency updates (F-28 / R-20): weekly pull requests for the trial app
# (pub, Gradle) and the pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
